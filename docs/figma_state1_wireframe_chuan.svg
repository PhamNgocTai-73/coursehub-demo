<svg width="1280" height="672" viewBox="0 0 1280 672" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="672" fill="#FFFFFF"/>

  <!-- Header -->
  <g id="Header_CourseHub">
    <rect x="32" y="24" width="1216" height="68" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="56" y="65" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#2D3A4B">CourseHub <tspan font-weight="500" fill="#3B4859">— Tra cứu và đăng ký lớp học phần</tspan></text>
  </g>

  <!-- Filter MaSinhVien -->
  <g id="Filter_MaSinhVien">
    <rect x="32" y="116" width="1216" height="92" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="56" y="167" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#2D3A4B">Mã sinh viên</text>
    <g id="Input_MaSV">
      <rect x="196" y="136" width="128" height="52" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="260" y="168" font-family="Inter, sans-serif" font-size="18" fill="#2D3A4B" text-anchor="middle">22000004</text>
    </g>
    <g id="Button_XemDangKy">
      <rect x="346" y="136" width="154" height="52" rx="6" fill="#20588A"/>
      <text x="423" y="168" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Xem đăng ký</text>
    </g>
    <text x="522" y="167" font-family="Inter, sans-serif" font-size="17" fill="#64748B">Chọn dữ liệu demo, không phải đăng nhập</text>
  </g>

  <!-- Panel Danh Sach Lop Hoc Phan -->
  <g id="Panel_DanhSachLopHocPhan">
    <rect x="32" y="236" width="800" height="312" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="56" y="276" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#2D3A4B">Danh sách lớp học phần</text>

    <g id="Input_TimKiemLop">
      <rect x="56" y="302" width="752" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="74" y="333" font-family="Inter, sans-serif" font-size="18" fill="#64748B">Tìm lớp / học phần ...</text>
    </g>

    <!-- Table Lop Hoc Phan -->
    <g id="Table_LopHocPhan">
      <rect x="56" y="372" width="752" height="150" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Lines -->
      <line x1="56" y1="422" x2="808" y2="422" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="56" y1="472" x2="808" y2="472" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="248" y1="372" x2="248" y2="522" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="468" y1="372" x2="468" y2="522" stroke="#CBD5E1" stroke-width="1.5"/>
      <line x1="596" y1="372" x2="596" y2="522" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Header Row -->
      <text x="72" y="402" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#2D3A4B">Lớp</text>
      <text x="264" y="402" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#2D3A4B">Học phần</text>
      <text x="484" y="402" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#2D3A4B">Còn</text>
      <text x="612" y="402" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#2D3A4B">Thao tác</text>

      <!-- Row 1: WEB-01 -->
      <text x="72" y="452" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#2D3A4B">WEB-01</text>
      <text x="264" y="452" font-family="Inter, sans-serif" font-size="18" fill="#2D3A4B">INT2204</text>
      <text x="484" y="452" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1D6147">1</text>
      <g id="Button_DangKy_WEB-01">
        <rect x="612" y="432" width="116" height="36" rx="6" fill="#20588A"/>
        <text x="670" y="456" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Đăng ký</text>
      </g>

      <!-- Row 2: DM-01 -->
      <text x="72" y="502" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#2D3A4B">DM-01</text>
      <text x="264" y="502" font-family="Inter, sans-serif" font-size="18" fill="#2D3A4B">INT2205</text>
      <text x="484" y="502" font-family="Inter, sans-serif" font-size="18" fill="#64748B">0</text>
      <g id="Button_HetCho_DM-01">
        <rect x="612" y="482" width="116" height="36" rx="6" fill="#EDF0F4" stroke="#CBD5E1"/>
        <text x="670" y="506" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#5B6775" text-anchor="middle">Hết chỗ</text>
      </g>
    </g>
  </g>

  <!-- Panel Lop Da Dang Ky -->
  <g id="Panel_LopDaDangKy">
    <rect x="864" y="236" width="384" height="312" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="888" y="276" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#2D3A4B">Lớp đã đăng ký</text>
    <text x="888" y="321" font-family="Inter, sans-serif" font-size="18" fill="#2D3A4B">Danh sách / trạng thái rỗng</text>
    <g id="Button_HuyDangKy">
      <rect x="888" y="346" width="336" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="906" y="377" font-family="Inter, sans-serif" font-size="18" fill="#64748B">Hủy đăng ký</text>
    </g>
    <text x="888" y="427" font-family="Inter, sans-serif" font-size="16" fill="#64748B">Hiển thị từ API của sinh viên đang xem.</text>
  </g>

  <!-- Footer Vung Thong Bao -->
  <g id="Footer_VungThongBao">
    <rect x="32" y="576" width="1216" height="68" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="56" y="618" font-family="Inter, sans-serif" font-size="18" fill="#64748B">Vùng thông báo: đang tải · thành công · lỗi 404/409</text>
  </g>
</svg>
